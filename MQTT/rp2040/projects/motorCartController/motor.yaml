  number:
    - platform: mqtt
      name: "Motor 1 Speed"
      unique_id: "motor_cart_motor1_speed"
      command_topic: "Cart/1/Motor1/Speed"
      state_topic: "Cart/1/Motor1/StateSpeed"
      min: 0
      max: 100
      step: 1
      mode: slider
      qos: 1
      retain: true

    - platform: mqtt
      name: "Motor 2 Speed"
      unique_id: "motor_cart_motor2_speed"
