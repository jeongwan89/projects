# Home Assistant MQTT package for the RP2040 motor cart controller
#
# Add the following to configuration.yaml:
#
# homeassistant:
#   packages:
#     motor_cart_controller: !include motor.yaml

mqtt:
  switch:
    - platform: mqtt
      name: "Motor 1 Forward"
      unique_id: "motor_cart_motor1_forward"
      command_topic: "Cart/1/Motor1/Dir"
      state_topic: "Cart/1/Motor1/StateDir"
      payload_on: "FW"
      payload_off: "Stop"
      state_on: "FW"
      state_off: "Stop"
      qos: 1
      retain: true
      icon: mdi:arrow-right-bold

    - platform: mqtt
      name: "Motor 1 Stop"
      unique_id: "motor_cart_motor1_stop"
      command_topic: "Cart/1/Motor1/Dir"
      state_topic: "Cart/1/Motor1/StateDir"
      payload_on: "Stop"
      payload_off: "Stop"
      state_on: "Stop"
      state_off: "FW"
      qos: 1
      retain: true
      icon: mdi:stop-circle-outline

    - platform: mqtt
      name: "Motor 1 Backward"
      unique_id: "motor_cart_motor1_backward"
      command_topic: "Cart/1/Motor1/Dir"
      state_topic: "Cart/1/Motor1/StateDir"
      payload_on: "BW"
      payload_off: "Stop"
      state_on: "BW"
      state_off: "Stop"
      qos: 1
      retain: true
      icon: mdi:arrow-left-bold

    - platform: mqtt
      name: "Motor 2 Forward"
      unique_id: "motor_cart_motor2_forward"
      command_topic: "Cart/1/Motor2/Dir"
      state_topic: "Cart/1/Motor2/StateDir"
